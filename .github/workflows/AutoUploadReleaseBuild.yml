# 插件自动发布：推 v* 标签时构建 **Windows 与 Linux 两版**插件动态库并建 Release。
# 与框架仓 Arona-rs 的同名工作流一套路（那边也是 Windows + Linux 两条腿）。
#
# ── 为什么是两条腿，而不是"编一次、改个扩展名" ────────────────────────────────
# 框架把插件动态库直接映射进宿主进程，并跨边界交换 `Arc<dyn AronaPlugin>`。装载前它会逐项
# 比对工具链指纹（crates/arona/build.rs 算出来、export_arona_plugin! 原样上报），其中就含
# TARGET / profile / crt-static 三项。所以 **Windows 宿主只装 .dll，Linux 宿主只装 .so**，
# 两边必须各自按自己的目标三元组重新编一遍；拿 .dll 改名叫 .so 是装载当场拒载，不是"大概能用"。
# 相应地产物形态也由构建平台决定（见矩阵里的 lib_prefix / lib_ext，以及收集产物那一步）：
#   Windows  cargo 产出        <name>.dll       不需要 crt 之外的系统依赖
#   Linux    cargo 产出 lib<name>.so            依赖 glibc（动态链接，**刻意不做静态**）
# Linux 这一腿不做 crt-static 是硬要求：musl 静态二进制里 dlopen 是空桩、rustc 也不支持
# musl 的 cdylib，静态化了插件根本装不进宿主。仓库根的 .cargo/config.toml 只给 MSVC 目标
# 打开 crt-static，Linux 目标天然不走那一行——"要不要静态 C 运行库"由构建目标决定，不是全局开关。
#
# ── 为什么要把框架仓也签出来 ───────────────────────────────────────────────
# 插件与框架唯一不同的一处，也是这份文件存在的核心理由：Cargo.toml 里
# `arona = { package = "arona-rs", path = "../Arona-rs/crates/arona", ... }` 是**路径依赖**，
# CI 上那个上一级目录本来不存在。两种省事的做法都不成立——
#   · 换成 crates.io 版本：那是按发布快照编的，与宿主实际用的框架源码不是一个东西；
#   · 换成 git 标签：标签落后于宿主构建所用的提交时，编出的动态库布局号对不上，装载当场被拒。
# 所以这里把框架仓签出来放在插件的同级，路径依赖原样成立，目录形状和本机开发一模一样
# （G:\rustprojects 下插件与 Arona-rs 并排）。宿主用哪份框架编的，就把那个 ref 填进
# 仓库 Settings → Actions → Variables 的 `ARONA_REF`（分支名、标签或提交号都行）；
# 不设就用 main——它与当前发版宿主同源（`PluginMeta.group_scoped` 与布局 10 都在上面）。
#
# 版本号以 Cargo.toml 为准：标签 vX.Y.Z 必须等于 [package] version，否则直接失败——
# 插件上报给框架的版本取自 env!("CARGO_PKG_VERSION")，标签与它不一致就会出现
# "Release 写着 0.1.6、GUI 里显示 0.1.5" 这种没法核对的事。
name: AutoUploadReleaseBuild

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  Build:
    # 两腿各编各的平台；fail-fast 关掉，一腿失败不影响另一腿把日志跑完（便于一次看全两边）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            # cdylib 在 Windows 上不加前缀，扩展名 .dll
            lib_prefix: ''
            lib_ext: dll
          - os: ubuntu-latest
            platform: linux-x64
            # cargo 给 cdylib 自动加 lib 前缀，扩展名 .so（框架按 library_extension() 认）
            lib_prefix: 'lib'
            lib_ext: so
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout 插件
        uses: actions/checkout@v4
        with:
          path: plugin

      # 路径依赖的上一级：框架仓签到插件的同级目录，../Arona-rs/crates/arona 才解析得动
      - name: Checkout 框架（供路径依赖）
        uses: actions/checkout@v4
        with:
          repository: YuLinLoli/Arona-rs
          ref: ${{ vars.ARONA_REF || 'main' }}
          path: Arona-rs

      # Linux 腿有两项外部前提，都由 runner 现装；Windows 腿两项都不需要
      # （MSVC 工具链自带，系统里本来就有 SimHei/微软雅黑）。
      #
      # ① C 编译器：arona 依赖的 rusqlite 开了 `bundled`，会把 sqlite3.c 现场编出来。
      # ② 中文字体：出图插件的用例要真画汉字，而**裸 runner 一份 CJK 字都没有**——
      #    缺了会以「找不到中文字体：安装目录的 fonts/ 里没有字体文件」当场 panic
      #    （bilibili 33 条、petpet 2 条）。装 fonts-noto-cjk 后正好命中框架
      #    arona::runtime::text::CANDIDATES 的第一条系统候选
      #    /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc；同一个包里还带
      #    NotoSansCJK-Bold.ttc，粗体那一档用例才有真粗体面可走（否则只能走叠画兜底）。
      #
      # 两项都在缺失时才装：镜像一旦自带就跳过 apt，省掉一次 update 的等待与抖动。
      - name: Prepare Linux build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          need=0
          command -v cc >/dev/null 2>&1 || need=1
          [ -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ] || need=1
          if [ "$need" -eq 1 ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config fonts-noto-cjk
          fi
          cc --version | head -1
          # 字体这一条要真的点名核对：装没装上直接决定那批出图用例是过还是 panic，
          # 与其在 Test 步里看 33 条一样的 panic，不如在这里一次说清
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            echo "::error::中文字体没到位，出图用例会以「找不到中文字体」失败"
            find /usr/share/fonts -name 'NotoSansCJK*' -o -name '*wqy*' | head -20
            exit 1
          fi
          ls -l /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc \
                /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc

      # Linux 交付件要按 **glibc 2.17 基线**链接：插件是 .so，宿主的 glibc 低于链接基线
      # 会直接拒绝装载。2.17 是 CentOS 7 / Ubuntu 16.04 时代的水位，钉在这儿意味着之后
      # 所有发行版（含框架的 compat 包宿主）都能装同一份 .so，不必给用户两个包去挑。
      #
      # 这条路对 ABI 是**无痛**的：`.2.17` 只是 cargo-zigbuild 的语法，只影响链接阶段，
      # cargo 认的目标仍是 x86_64-unknown-linux-gnu —— 于是 build.rs 读到的 TARGET、
      # 以及算出来的 ABI 指纹（target 段 + crt-static 段）跟普通 gnu 构建一字不差，
      # 装载握手不受任何影响。反证也说明了这一点：框架自己的 compat 包宿主必须能装
      # 普通方式编出来的插件，指纹不可能随 glibc 基线变。
      #
      # zig 版本与框架仓 Windows/Linux 两条腿保持一致（0.17.0），两边用同一套链接器行为。
      - name: Install zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-zigbuild --locked
          # 只打版本做记录。别写 `cargo zigbuild --version`——cargo-zigbuild 的 CLI
          # 只认 `zigbuild --verbose`，多一个不认识的参数就 exit 2（第一次跑就踩了）
          zig version
          command -v cargo-zigbuild

      # 工具链由插件仓自己的 rust-toolchain.toml 唯一决定：ABI 指纹里带着 rustc 的 release 号，
      # CI 用当天的 stable 编，产物就会和正式宿主对不上指纹而被拒载。这里只打印生效的那份。
      - name: Show active toolchain
        run: |
          rustup show active-toolchain
          rustc -vV

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin
          # 两腿的目标三元组不同，缓存不能混用
          key: ${{ matrix.platform }}

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
              Select-Object -First 1
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($tag -ne $pkg.version) {
              Write-Error "标签 ${{ github.ref_name }} 与 $($pkg.name) 版本 $($pkg.version) 不一致"
              exit 1
          }
          Write-Host "版本校验通过: $($pkg.name) $($pkg.version)"

      # 离线单测。各仓联网冒烟用例都带 #[ignore]，不会在这里跑。
      # 这里刻意不带 --target：用例跑在构建机自己的目标上最快，也没有"给老系统也能跑"
      # 的诉求——基线只对交付的 .so 有意义。
      - name: Test
        run: cargo test --release

      # Windows：普通 release 构建
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release

      # Linux：走 cargo zigbuild 把 glibc 钉在 2.17（理由见上面 Install zig 那一段）
      - name: Build (Linux, glibc 2.17)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17

      # 产物与发布说明一起准备好。发布说明里那几件事（宿主版本 / 工具链 / 平台 / 投放路径）
      # 全部现取现算，不从 README 手抄——手抄的那几处正是会跟代码各说各话的地方。
      #
      # 这一步用 pwsh 而不是按平台分 bash/pwsh 写两份：GitHub 的 ubuntu 镜像自带 PowerShell 7，
      # 同一份脚本两边都能跑，省掉一整段"平台分支里各写一遍 id 探测与正则"的重复。
      # 真正随平台变的只有三样——产物前缀、扩展名、crt 那一句——它们由矩阵与 RUNNER_OS 决定。
      - name: Collect artifact and release notes
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $pkg = $meta.packages | Select-Object -First 1
          $cdylib = $pkg.targets | Where-Object { $_.kind -contains 'cdylib' } |
              Select-Object -First 1
          if (-not $cdylib) {
              Write-Error "crate 里没有 cdylib 目标，编不出能被框架扫描装载的动态库"
              exit 1
          }

          # 产物路径由构建平台决定：Windows 是 target/release/<name>.dll，
          # Linux 是 target/x86_64-unknown-linux-gnu/release/lib<name>.so
          # （Linux 腿显式带 --target，cargo 就会把产物放进三元组子目录；
          #  目录名**不带** .2.17 后缀——那个后缀只传给链接器，cargo 认的还是基础三元组）
          $onWindows = $env:RUNNER_OS -eq 'Windows'
          $prefix = '${{ matrix.lib_prefix }}'
          $ext = '${{ matrix.lib_ext }}'
          $platformTag = '${{ matrix.platform }}'
          $releaseDir = 'target/release'
          if (-not $onWindows) { $releaseDir = 'target/x86_64-unknown-linux-gnu/release' }
          $built = Join-Path $releaseDir "$prefix$($cdylib.name).$ext"
          if (-not (Test-Path $built)) { Write-Error "未找到构建产物 $built"; exit 1 }
          $size = (Get-Item $built).Length
          if ($size -lt 100KB) {
              Write-Error "动态库只有 $size 字节，链接明显没成功，不发出去坑用户"
              exit 1
          }

          # Linux 那份必须真的钉在 glibc 2.17 上——这是它能装进老系统的唯一依据，
          # 而"zigbuild 到底生效没有"光看命令有没有报错是看不出来的（比如 target 后缀
          # 被悄悄忽略，照样编得出一份要 2.34 的 .so）。这里按符号版本实扫一遍：
          # 有任何一个符号要求高于 2.17，就直接不发，免得把"声称万能"的东西发出去。
          if ($env:RUNNER_OS -ne 'Windows') {
              $objdump = Get-Command objdump -ErrorAction SilentlyContinue
              if (-not $objdump) {
                  Write-Error "找不到 objdump，没法核对 glibc 基线（binutils 本应随 runner 自带）"
                  exit 1
              }
              $vers = & $objdump.Source -T $built |
                  Select-String -Pattern 'GLIBC_(\d+)\.(\d+)' -AllMatches |
                  ForEach-Object { $_.Matches } |
                  ForEach-Object { [version]("{0}.{1}" -f $_.Groups[1].Value, $_.Groups[2].Value) }
              if (-not $vers) {
                  Write-Error "objdump 没扫到任何 GLIBC 符号版本，产物形态可疑：$built"
                  exit 1
              }
              $maxVer = $vers | Sort-Object -Descending | Select-Object -First 1
              Write-Host "最高 GLIBC 符号版本: $maxVer"
              if ($maxVer -gt [version]'2.17') {
                  Write-Error "glibc 基线没钉住：最高要求 $maxVer > 2.17，zigbuild 的 target 后缀没生效"
                  exit 1
              }
          }

          # 框架那一侧的两项：crate 版本与符号布局号，都从签下来的源码里读，
          # 因为"宿主是用哪份框架编的"决定这份动态库装不装得进去。
          # 框架 1.2.1 起握手只比布局号 + 工具链指纹：契约版本（FRAMEWORK_API_VERSION）
          # 与 crate 版本都已从判据里删掉，所以这里也不再读它们——去读一个已经不存在的
          # 常量，只会让发布说明里那个括号写出一句空话。
          $fwManifest = "../Arona-rs/crates/arona/Cargo.toml"
          $fwVersion = ([regex]::Match((Get-Content -Raw $fwManifest),
              '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          $abiText = Get-Content -Raw "../Arona-rs/crates/arona/src/plugin/abi.rs"
          $layout = ([regex]::Match($abiText,
              'ABI_LAYOUT:\s*u32\s*=\s*(\d+)')).Groups[1].Value

          # 插件 id：先扫 cdylib 的入口文件，再扫其余源文件（petpet 那种 lib.rs 只做 mod 转发、
          # meta() 写在业务模块里的仓库要往后找）。两条判据都要求"像个 id"——小写字母开头、
          # 只含小写字母/数字/-/_，且回退那条不许跨过分号。不这么钉就会抓错：BlueArchive 的
          # meta() 第一个参数是常量、展示名又带大写，注释里提一句 PLUGIN_ID 就能让宽松的
          # [^=]* 一路滑到下一个常量上，抓出「每日活动推送」这种中文展示名。
          $entry = $cdylib.src_path
          $files = @($entry) + (Get-ChildItem -Recurse -Filter *.rs -Path src |
              ForEach-Object { $_.FullName } | Where-Object { $_ -ne $entry })
          $id = ''
          foreach ($file in $files) {
              $text = Get-Content -Raw $file
              $found = [regex]::Match($text,
                  'PluginMeta::new\(\s*"(?<id>[a-z0-9][a-z0-9_-]{1,31})"')
              if (-not $found.Success) {
                  $found = [regex]::Match($text,
                      '(?:const|static)[^;]*?PLUGIN_ID\s*:\s*&str\s*=\s*"(?<id>[a-z0-9][a-z0-9_-]{1,31})"')
              }
              if ($found.Success) {
                  $id = $found.Groups['id'].Value
                  break
              }
          }
          if (-not $id) { $id = '<插件 id，见 plugin.yml>' }

          # 工具链三件套：ABI 指纹的后两段就是这两行，出事先在日志里跟插件上报的逐段对
          $vv = rustc -vV | Out-String
          $rustc = ([regex]::Match($vv, '(?m)^release:\s*(.+)$')).Groups[1].Value.Trim()
          # 变量千万别叫 $host：那是 PowerShell 的只读自动变量（宿主对象本身），
          # 赋值会当场报 VariableNotWritable，写出来的三元组变成 InternalHost
          $hostTriple = ([regex]::Match($vv, '(?m)^host:\s*(.+)$')).Groups[1].Value.Trim()

          # CRT / glibc 口径也由构建平台决定：MSVC 上静态链接运行库（目标机无需装 VC++ 运行时）；
          # Linux 上不可能静态（musl 静态会让 dlopen 失效），改为用 zigbuild 把 glibc 基线
          # 钉在 2.17，这样同一份 .so 在标准包宿主与 compat 包宿主上都能装。
          # （$onWindows 在上面取产物路径时已经算过了，这里直接复用）
          $extra = @()
          if ($onWindows) {
              $heading = "### Windows（$platformTag）"
              $crtNote = '--release，crt-static（静态链接 MSVC 运行库，目标机无需装 VC++ 运行时）'
              $dropHint = '下载后放进 <框架运行目录>/plugins/' + $id + '/，重启框架'
          } else {
              $heading = "### Linux（$platformTag）"
              $crtNote = "--release，cargo-zigbuild 按 glibc 2.17 基线链接（实扫最高 GLIBC 符号 $maxVer）"
              $dropHint = '下载后放进 <框架运行目录>/plugins/' + $id + '/（框架也认 plugins/ 直属的 .so），重启框架'
              $extra = @(
                  'glibc 基线 2.17：框架的标准包宿主与 compat 包宿主装的是同一份 .so，不必二选一；',
                  'CentOS 7 / Ubuntu 16.04 时代起的发行版都能装载。'
              )
          }

          $asset = "$prefix$($cdylib.name)-$($pkg.version)-$platformTag.$ext"
          Copy-Item $built $asset -Force
          $notes = @(
              $heading,
              '',
              "适用于 Arona-rs $fwVersion（符号布局 $layout）",
              "构建工具链：rustc $rustc，$hostTriple，$crtNote",
              "产物 $asset，$([math]::Round($size / 1MB, 2)) MB。",
              $dropHint
          ) + $extra + @(
              '',
              '插件必须与宿主同平台、同工具链、同目标三元组：Windows 宿主要 .dll，Linux 宿主要 .so，两者不能互换。',
              '宿主还必须是同一符号布局号才装得进去；对不上时框架会拒载并在日志写明两边各是几。'
          )
          # 显式无 BOM 的 UTF-8：Set-Content 的 -Encoding utf8 在 5.1 与 7 上行为不同
          # （前者带 BOM），Release 正文开头多一个不可见字符很难查；WriteAllLines 两版一致，
          # 而且是整份覆盖，不会把上一次跑剩的内容接在后面
          [System.IO.File]::WriteAllLines(
              (Join-Path (Get-Location) "NOTES.md"), $notes, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content NOTES.md
          "ASSET_NAME=$asset" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            plugin/${{ env.ASSET_NAME }}
            plugin/NOTES.md
          if-no-files-found: error

  Publish:
    needs: Build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 刻意**不开** merge-multiple：两腿的工件里都各有一个 NOTES.md，平铺到一起会互相覆盖，
      # 最后 Release 正文只会剩下其中一个平台的说法。不合并则落到 dist/<工件名>/ 下，下一步再拼。
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Merge release notes
        shell: bash
        run: |
          set -euo pipefail
          : > dist/NOTES.md
          for f in dist/*/NOTES.md; do
            [ -e "$f" ] || continue
            cat "$f" >> dist/NOTES.md
            printf '\n' >> dist/NOTES.md
          done
          echo '--- 合并后的发布说明 ---'
          cat dist/NOTES.md

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          # 两腿的产物各有各的前缀与扩展名，一起发上去
          artifacts: "dist/*/*.dll,dist/*/*.so"
          # 入参名是 bodyFile，写成 bodyPath 不会失败——action 只给一条
          # "Unexpected input(s)" 警告，Release 照建，正文静默为空。第一次跑就踩中了，
          # 改名并留这一句：正文空着比构建失败更难发现
          bodyFile: "dist/NOTES.md"
          prerelease: ${{ contains(github.ref, 'pre') }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
